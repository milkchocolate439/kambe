# Blueprint Render untuk KAMBE (satu layanan web: API + WebSocket + tampilan dari dist/).
#
# Paket FREE (sementara, tanpa kartu): TANPA disk persisten — database SQLite ikut terhapus saat server
# tidur (15 menit sepi), restart, atau deploy. Kunci notaris tetap stabil karena diturunkan dari
# KAMBE_NOTARY_SEED (dibuat acak oleh Render sekali, disimpan sebagai variabel lingkungan).
#
# Naik ke paket berbayar dengan data permanen: ganti `plan: starter`, tambahkan
#   disk: { name: kambe-data, mountPath: /var/data, sizeGB: 1 }
# dan variabel KAMBE_DB=/var/data/kambe.db.
services:
  - type: web
    name: kambe
    runtime: node
    region: singapore
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: KAMBE_SECURE
        value: "1"
      - key: KAMBE_TRUST_PROXY
        value: "1"
      - key: KAMBE_NOTARY_SEED
        generateValue: true
      # Default produk (ditulis eksplisit agar jelas): gratis + pembayaran langsung antarpengguna.
      - key: KAMBE_PAYMENT_PROVIDER
        value: langsung
      - key: KAMBE_FREE_PLATFORM
        value: "1"
      # KAMBE_MODERATORS (ID akun moderator) disetel di dasbor setelah akunnya dibuat.
